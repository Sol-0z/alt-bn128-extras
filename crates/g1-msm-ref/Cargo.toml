[package]
name        = "alt-bn128-g1-msm-ref"
version     = "0.1.0"
description = "Reference implementation of alt_bn128_g1_msm (Pippenger window-NAF MSM over BN254 G1) for the Solana SIMD-XXXX proposal. no_std-compatible."
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
repository    = "https://github.com/Sol-0z/alt-bn128-extras"
homepage      = "https://github.com/Sol-0z/alt-bn128-extras"
documentation = "https://docs.rs/alt-bn128-g1-msm-ref"
readme        = "../../README.md"
keywords      = ["solana", "bn254", "msm", "pippenger", "cryptography"]
categories    = ["cryptography", "no-std"]

[lib]
name = "g1_msm_ref"
path = "src/lib.rs"

[features]
default = []
std     = ["ark-bn254/std", "ark-ec/std", "ark-ff/std", "ark-serialize/std"]

[dependencies]
ark-bn254       = { workspace = true }
ark-ec          = { workspace = true }
ark-ff          = { workspace = true }
ark-serialize   = { workspace = true }
ark-std         = { workspace = true }

[dev-dependencies]
hex             = { workspace = true, features = ["std"] }
